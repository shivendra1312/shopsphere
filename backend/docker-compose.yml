services:
  postgres:
    image: postgres:16
    container_name: shopsphere_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shopsphere
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: shopsphere_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: